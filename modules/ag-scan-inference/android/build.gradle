plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.agscaninference'
version = '0.1.0'

android {
  namespace "expo.modules.agscaninference"

  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    minSdkVersion 23
  }

}

dependencies {
  // LiteRT's stable Interpreter API. The model remains fully on the device.
  implementation 'com.google.ai.edge.litert:litert:1.4.2'
  implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
